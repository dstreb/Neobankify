[tool.poetry]
name = "neobank-ai-agents"
version = "0.1.0"
description = "AI agents for the Neobank platform - Rewards, Idle Cash, Risk, Behavioral, Orchestrator"
authors = ["Neobankify <engineering@neobankify.io>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
confluent-kafka = "^2.3.0"
redis = "^5.0.0"
psycopg2-binary = "^2.9.9"
pydantic = "^2.5.0"
httpx = "^0.25.0"
structlog = "^23.2.0"
openai = "^1.6.0"
numpy = "^1.26.0"
scikit-learn = "^1.3.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.23.0"
black = "^23.12.0"
ruff = "^0.1.9"
mypy = "^1.8.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
