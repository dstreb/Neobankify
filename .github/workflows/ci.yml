name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  # =====================================================
  # LINT & TYPE CHECK - TypeScript Services
  # =====================================================
  lint-typescript:
    name: Lint & Type Check (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install root dependencies
        run: npm install --ignore-scripts
        working-directory: .

      - name: Build shared packages
        run: |
          cd packages/shared-types && npm install && npx tsc
          cd ../event-schemas && npm install && npx tsc

      - name: Lint & type check services
        run: |
          for service in services/*/; do
            echo "Checking $service..."
            cd "$service"
            npm install
            npx tsc --noEmit || true
            cd ../..
          done

  # =====================================================
  # LINT - Python AI Agents
  # =====================================================
  lint-python:
    name: Lint (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install ruff mypy black
        working-directory: ai-agents

      - name: Run ruff
        run: ruff check ai-agents/ || true

      - name: Run black check
        run: black --check ai-agents/ || true

  # =====================================================
  # SECURITY SCAN
  # =====================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Audit npm dependencies
        run: |
          for service in services/*/; do
            echo "Auditing $service..."
            cd "$service"
            npm install
            npm audit --audit-level=high || true
            cd ../..
          done

      - name: Check for secrets in code
        run: |
          # Simple check for common secret patterns
          if grep -rn "password\s*=\s*['\"][^'\"]*['\"]" services/ --include="*.ts" | grep -v "process.env" | grep -v "neobank_dev" | grep -v "test"; then
            echo "WARNING: Potential hardcoded secrets found"
          fi

  # =====================================================
  # SQL MIGRATION VALIDATION
  # =====================================================
  validate-migrations:
    name: Validate SQL Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: neobank_test
          POSTGRES_USER: neobank
          POSTGRES_PASSWORD: neobank_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Run migrations
        run: |
          for migration in database/migrations/*.sql; do
            echo "Running $migration..."
            PGPASSWORD=neobank_test psql -h localhost -U neobank -d neobank_test -f "$migration"
          done
        env:
          PGPASSWORD: neobank_test

  # =====================================================
  # DOCKER BUILD CHECK
  # =====================================================
  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API Gateway
        run: |
          docker build -f docker/Dockerfile.node -t neobank-api-gateway:test services/api-gateway/
